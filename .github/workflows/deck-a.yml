name: Deck A Gate

on:
  push:
    branches: [module/deck-a]
    paths:
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - 'index.html'
      - 'src/**'
      - 'public/audio/**'
      - 'tests/browser/**'
      - 'docs/contracts/DECK_A.md'
      - 'docs/research/DECK_A_2026.md'
      - '.github/workflows/deck-a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deck-a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package.json
      - name: Install toolchain
        run: npm install
      - name: Typecheck, unit tests, production build
        run: npm run check
      - name: Install Chrome for Testing
        run: npx playwright install --with-deps chromium
      - name: Browser runtime and audio-kernel regression gates
        run: npm run test:browser
      - name: Upload Phase 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deck-a-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            package-lock.json
            dist/
            playwright-report/
            test-results/
