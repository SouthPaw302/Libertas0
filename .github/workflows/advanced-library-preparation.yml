name: Advanced Library Preparation Gate

on:
  push:
    branches:
      - 'module/advanced-library-preparation'
    paths:
      - 'src/library/**'
      - 'src/main.ts'
      - 'index.html'
      - 'tests/browser/advanced-library-preparation.spec.ts'
      - 'docs/contracts/ADVANCED_LIBRARY_PREPARATION.md'
      - 'MODULE_REGISTRY.json'
      - 'DEVELOPMENT_STATE.json'
      - 'SYSTEM_CONTRACT.json'
      - 'CAPABILITY_REGISTRY.json'
      - '.github/workflows/advanced-library-preparation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advanced-library-preparation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install
      - name: Bootstrap / contract
        run: python bootstrap.py && python scripts/validate_system.py
      - name: Typecheck, unit tests, build
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Advanced library / preparation browser gate
        run: npx playwright test tests/browser/advanced-library-preparation.spec.ts
      - name: Original library compatibility
        run: npx playwright test tests/browser/phase10.spec.ts -g "IndexedDB library deduplicates"
      - name: Locked performance-transport regression
        run: npx playwright test tests/browser/performance-transport.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: advanced-library-preparation-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
