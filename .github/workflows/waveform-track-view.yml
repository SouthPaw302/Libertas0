name: Waveform Track View Gate

on:
  push:
    branches:
      - 'module/waveform-track-view'
    paths:
      - 'src/waveform/**'
      - 'src/deck/DeckController.ts'
      - 'src/main.ts'
      - 'index.html'
      - 'tests/browser/waveform-track-view.spec.ts'
      - 'docs/contracts/WAVEFORM_TRACK_VIEW.md'
      - 'MODULE_REGISTRY.json'
      - 'DEVELOPMENT_STATE.json'
      - 'SYSTEM_CONTRACT.json'
      - 'CAPABILITY_REGISTRY.json'
      - '.github/workflows/waveform-track-view.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waveform-track-view-${{ github.ref }}
  cancel-in-progress: true

jobs:
  waveform:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install
      - name: Bootstrap / contract
        run: python bootstrap.py && python scripts/validate_system.py
      - name: Typecheck, unit tests, build
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Waveform / track-view browser gate
        run: npx playwright test tests/browser/waveform-track-view.spec.ts
      - name: Locked transport and SYNC regressions
        run: npx playwright test tests/browser/performance-transport.spec.ts tests/browser/sync.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waveform-track-view-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
