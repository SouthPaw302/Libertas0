name: Audio Kernel Gate

on:
  push:
    branches: [module/audio-kernel]
    paths:
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - 'index.html'
      - 'src/**'
      - 'public/audio/**'
      - 'tests/browser/**'
      - 'docs/contracts/AUDIO_KERNEL.md'
      - 'docs/research/AUDIO_KERNEL_2026.md'
      - '.github/workflows/audio-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package.json
      - name: Install pinned toolchain
        run: npm install
      - name: Typecheck, unit test, build
        run: npm run check
      - name: Install Chrome for Testing
        run: npx playwright install --with-deps chromium
      - name: Browser runtime gate
        run: npm run test:browser
      - name: Upload Phase 2 automated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-kernel-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            package-lock.json
            dist/
            playwright-report/
            test-results/
