<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Libertas0 — Musical Clock</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 1200px; }
    .decks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    fieldset { margin: 1rem 0; padding: 1rem; min-width: 0; }
    .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin: .5rem 0; }
    label { display: flex; gap: .5rem; align-items: center; }
    input[type="range"] { width: 220px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #111; color: #eee; padding: 1rem; max-height: 320px; overflow: auto; }
    @media (max-width: 800px) { .decks { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Libertas0 — Musical Clock</h1>

    <div class="decks">
      <fieldset>
        <legend>Deck A</legend>
        <div class="row">
          <input id="deck-a-file" type="file" accept="audio/*" />
          <button id="deck-a-load" type="button">Load A</button>
          <button id="deck-a-play" type="button">Play A</button>
          <button id="deck-a-pause" type="button">Pause A</button>
        </div>
        <div class="row">
          <label>Seek A <input id="deck-a-seek" type="range" min="0" max="1000" value="0" /></label>
          <label>Rate A <input id="deck-a-rate" type="number" min="0.25" max="4" step="0.01" value="1" /></label>
        </div>
        <div class="row">
          <label>Volume A <input id="deck-a-volume" type="range" min="0" max="1" step="0.01" value="1" /></label>
          <label><input id="deck-a-mute" type="checkbox" /> Mute A</label>
        </div>
        <pre id="deck-a-status">Deck A ready</pre>
      </fieldset>

      <fieldset>
        <legend>Deck B</legend>
        <div class="row">
          <input id="deck-b-file" type="file" accept="audio/*" />
          <button id="deck-b-load" type="button">Load B</button>
          <button id="deck-b-play" type="button">Play B</button>
          <button id="deck-b-pause" type="button">Pause B</button>
        </div>
        <div class="row">
          <label>Seek B <input id="deck-b-seek" type="range" min="0" max="1000" value="0" /></label>
          <label>Rate B <input id="deck-b-rate" type="number" min="0.25" max="4" step="0.01" value="1" /></label>
        </div>
        <div class="row">
          <label>Volume B <input id="deck-b-volume" type="range" min="0" max="1" step="0.01" value="1" /></label>
          <label><input id="deck-b-mute" type="checkbox" /> Mute B</label>
        </div>
        <pre id="deck-b-status">Deck B ready</pre>
      </fieldset>
    </div>

    <fieldset>
      <legend>Musical Clock — manual grids</legend>
      <div class="decks">
        <div>
          <strong>Deck A Grid</strong>
          <div class="row">
            <label>BPM A <input id="clock-a-bpm" type="number" min="1" max="1000" step="0.01" value="120" /></label>
            <label>First beat frame A <input id="clock-a-origin" type="number" step="1" value="0" /></label>
            <label>Beats/bar A <input id="clock-a-beats-bar" type="number" min="1" max="32" step="1" value="4" /></label>
            <button id="clock-a-apply" type="button">Apply A grid</button>
          </div>
          <pre id="clock-a-status">Deck A musical clock waiting for loaded PCM</pre>
        </div>
        <div>
          <strong>Deck B Grid</strong>
          <div class="row">
            <label>BPM B <input id="clock-b-bpm" type="number" min="1" max="1000" step="0.01" value="120" /></label>
            <label>First beat frame B <input id="clock-b-origin" type="number" step="1" value="0" /></label>
            <label>Beats/bar B <input id="clock-b-beats-bar" type="number" min="1" max="32" step="1" value="4" /></label>
            <button id="clock-b-apply" type="button">Apply B grid</button>
          </div>
          <pre id="clock-b-status">Deck B musical clock waiting for loaded PCM</pre>
        </div>
      </div>
      <div class="row">
        <button id="clock-refresh" type="button">Refresh musical positions</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Mixer</legend>
      <div class="row">
        <label>Master <input id="mixer-master" type="range" min="0" max="1" step="0.01" value="1" /></label>
        <button id="mixer-status-button" type="button">Refresh mixer status</button>
      </div>
      <pre id="mixer-status">Mixer ready</pre>
    </fieldset>

    <details>
      <summary>Audio-kernel regression harness</summary>
      <div class="row">
        <button id="activate" type="button">Start diagnostic tone</button>
        <button id="stop" type="button">Stop diagnostic tone</button>
      </div>
      <pre id="status">not started</pre>
    </details>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
